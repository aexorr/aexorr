name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Fetch contributions
        env:
          GH_PROFILE_USER: aexorr
        run: |
          python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
