<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070b10"/>
    <stop offset="100%" stop-color="#0b1118"/>
  </linearGradient>

  <linearGradient id="cyan">
    <stop offset="0%" stop-color="#00f0ff"/>
    <stop offset="100%" stop-color="#00a8ff"/>
  </linearGradient>

  <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1000" height="300" rx="18" fill="url(#bg)"/>
<rect width="1000" height="300" rx="18" fill="url(#scan)"/>

<!-- BORDER -->
<rect x="1.5" y="1.5" width="997" height="297"
      rx="18"
      fill="none"
      stroke="#17303a"
      stroke-width="2"/>

<!-- HEADER -->
<rect x="0" y="0" width="1000" height="48" rx="18" fill="#0d151d"/>
<rect x="0" y="30" width="1000" height="18" fill="#0d151d"/>

<circle cx="25" cy="24" r="6" fill="#ff4057"/>
<circle cx="45" cy="24" r="6" fill="#ffbd2e"/>
<circle cx="65" cy="24" r="6" fill="#28c840"/>

