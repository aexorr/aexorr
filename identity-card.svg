<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05090d"/>
    <stop offset="55%" stop-color="#091118"/>
    <stop offset="100%" stop-color="#05080c"/>
  </linearGradient>

  <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff"/>
    <stop offset="100%" stop-color="#008cff"/>
  </linearGradient>

  <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- BACKGROUND -->
<rect width="1000" height="320" rx="18" fill="url(#bg)"/>
<rect width="1000" height="320" rx="18" fill="url(#scanlines)"/>

<!-- BORDER -->
<rect x="1.5" y="1.5"
      width="997"
      height="317"
      rx="18"
      fill="none"
      stroke="#15313b"
      stroke-width="2"/>


<!-- TERMINAL HEADER -->
<rect x="0" y="0"
      width="1000"
      height="48"
      rx="18"
      fill="#0b141c"/>

<rect x="0" y="30"
      width="1000"
      height="18"
      fill="#0b141c"/>

<circle cx="25" cy="24" r="6" fill="#ff4057"/>
<circle cx="45" cy="24" r="6" fill="#ffbd2e"/>
<circle cx="65" cy="24" r="6" fill="#28c840"/>

<text x="92" y="29"
      fill="#6f8792"
      font-family="monospace"
      font-size="14">
  IDENTITY_PROTOCOL // AEXORR
</text>

<text x="875" y="29"
      fill="#00eaff"
      font-family="monospace"
      font-size="12">
  NODE_07
</text>


<!-- LEFT COMMAND -->
<text x="45" y="82"
      fill="#00eaff"
      font-family="monospace"
      font-size="14"
      filter="url(#glow)">
  aexorr@github:~$ whoami
</text>


<!-- NAME -->
<text x="45" y="126"
      fill="#ffffff"
      font-family="monospace"
      font-size="31">
  AEXORR
</text>

<text x="45" y="153"
      fill="#00ff9c"
      font-family="monospace"
      font-size="12">
  DEVELOPER // BUILDER // EXPERIMENTER
</text>


<!-- DIVIDER -->
<line x1="45" y1="175"
      x2="590" y2="175"
      stroke="#16323d"/>


<!-- FOCUS -->
<text x="45" y="202"
      fill="#5e747f"
      font-family="monospace"
      font-size="12">
  FOCUS
</text>

<text x="145" y="202"
      fill="#ffffff"
      font-family="monospace"
      font-size="12">
  WEB • AI • AUTOMATION
</text>


<!-- MODE -->
<text x="45" y="229"
      fill="#5e747f"
      font-family="monospace"
      font-size="12">
  MODE
</text>

<text x="145" y="229"
      fill="#ff7135"
      font-family="monospace"
      font-size="12">
  BUILD / EXPERIMENT
</text>


<!-- SIGNAL -->
<text x="45" y="256"
      fill="#5e747f"
      font-family="monospace"
      font-size="12">
  SIGNAL
</text>

<text x="145" y="256"
      fill="#00ff9c"
      font-family="monospace"
      font-size="12">
  STABLE
</text>

<rect x="220" y="249"
      width="105"
      height="8"
      rx="2"
      fill="#101c23"/>

<rect x="220" y="249"
      width="88"
      height="8"
      rx="2"
      fill="url(#cyanLine)"
      filter="url(#glow)"/>


<!-- RIGHT HUD -->
<rect x="625" y="78"
      width="330"
      height="170"
      rx="11"
      fill="#070d13"
      stroke="#15343e"/>


<!-- HUD TITLE -->
<text x="650" y="105"
      fill="#ff4057"
      font-family="monospace"
      font-size="11">
  SYSTEM_ID
</text>

<text x="900" y="105"
      fill="#405761"
      font-family="monospace"
      font-size="10">
  0xA3
</text>


<!-- STATUS -->
<text x="650" y="133"
      fill="#637b86"
      font-family="monospace"
      font-size="12">
  STATUS
</text>

<text x="825" y="133"
      fill="#00ff9c"
      font-family="monospace"
      font-size="12">
  ONLINE
</text>


<!-- ACCESS -->
<text x="650" y="160"
      fill="#637b86"
      font-family="monospace"
      font-size="12">
  ACCESS
</text>

<text x="825" y="160"
      fill="#00ff9c"
      font-family="monospace"
      font-size="12">
  GRANTED
</text>


<!-- AUTH -->
<text x="650" y="187"
      fill="#637b86"
      font-family="monospace"
      font-size="12">
  AUTH
</text>

<text x="825" y="187"
      fill="#00eaff"
      font-family="monospace"
      font-size="12">
  VERIFIED
</text>


<!-- CHANNEL -->
<text x="650" y="214"
      fill="#637b86"
      font-family="monospace"
      font-size="12">
  CHANNEL
</text>

<text x="825" y="214"
      fill="#00eaff"
      font-family="monospace"
      font-size="12">
  SECURE
</text>


<!-- ACCESS BAR -->
<rect x="650" y="230"
      width="250"
      height="5"
      rx="2"
      fill="#101b22"/>

<rect x="650" y="230"
      width="210"
      height="5"
      rx="2"
      fill="url(#cyanLine)"/>


<!-- FOOTER -->
<line x1="45" y1="280"
      x2="955" y2="280"
      stroke="#15313b"/>

<text x="45" y="300"
      fill="#405761"
      font-family="monospace"
      font-size="10">
  // DIGITAL_IDENTITY // SECURE_NODE // NO_TRACE
</text>

<text x="870" y="300"
      fill="#00eaff"
      font-family="monospace"
      font-size="10">
  0xAEXORR
</text>

</svg>
